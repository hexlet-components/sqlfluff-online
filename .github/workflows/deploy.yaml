name: Deploy To GAE

# Деплой запускается руками. Автоматический по пушу в main включён быть не
# может: секрета GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON в репозитории нет, шаг
# авторизации падает сразу («must specify exactly one of
# workload_identity_provider or credentials_json»). До этой правки workflow
# стоял на ветке master, которой нет с переименования, поэтому отказ никому не
# показывался.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Authorize to Google Cloud
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2.1.13
        with:
          credentials_json: '${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON }}'

      - name: Deploy to App Engine
        id: deploy
        uses: google-github-actions/deploy-appengine@a343979004148afb93c94c712b467e8e9f01b06b # v2.1.8

      - name: cURL Test
        run: curl "${{ steps.deploy.outputs.url }}"

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f' # v2.2.1

      - name: Delete Old App Versions
        # delete all but latest 5 versions
        shell: bash
        run: |
          gcloud app versions list \
            --format="value(version.id)" \
            --sort-by="~version.createTime" \
            | tail -n +5 \
            | xargs -r gcloud app versions delete --quiet

      # make sure we didn't delete the current version
      - name: cURL Test
        run: curl "${{ steps.deploy.outputs.url }}"
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          cache-from: ghcr.io/${{ github.repository }}:latest
          cache-to: type=inline
          tags: ghcr.io/${{ github.repository }}:latest
