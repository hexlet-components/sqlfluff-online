version: 2
updates:
  # Здесь именно pip, а не uv: проект живёт на requirements.txt и setup.py.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore"
    groups:
      pip-all:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore"
    groups:
      github-actions-all:
        patterns: ["*"]
